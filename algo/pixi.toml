[workspace]
authors = ["Girish Vλas <vgd.vyas17@gmail.com>"]
channels = ["conda-forge"]
name = "algo"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
lint = { cmd = "ty check . && ruff check ." }
format = { cmd = "ruff format ." }

[dependencies]
biopython = ">=1.86,<2"
black = ">=26.1.0,<27"
isort = ">=8.0.1,<9"
pre-commit = ">=4.5.1,<5"
ruff = ">=0.15.10,<0.16"
mypy = ">=1.19.1,<2"
ty = ">=0.0.29,<0.0.30"
